[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tasks]

[environments]
cpu = ["test"]
cuda = ["cuda", "test"]

[dependencies]
python = ">=3.12.12"
tensorflow = "*"
matplotlib = ">=3.10.8"
scikit-learn = ">=1.8.0"
jupyterlab = ">=4.5.1"
ipdb = ">=0.13.13"
line_profiler = ">=5.0.0"

[pypi-dependencies]
medmnist = ">=3.0.2"
ytm = { path = ".", editable = true}

[feature.cuda]
platforms = ["linux-64"]
system-requirements = { cuda = "12" }
dependencies = {cuda = ">=12.9.1", pycuda = ">=2025.1.2"}

[feature.test.pypi-dependencies]
pytest = "*"
