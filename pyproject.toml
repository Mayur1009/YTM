[project]
authors = [{name = "Mayur", email = "mayurks@uia.no"}]
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "psutil",
]
name = "YTM"
requires-python = ">=3.11"
version = "0.7.4+w36"

[project.optional-dependencies]
cuda = [
    "cupy-cuda12x[ctk]",
    "nvidia-ml-py",
]
examples = [
    "matplotlib",
    "seaborn",
    "datasets",
    "scikit-learn",
    "medmnist",
    "albumentationsx[headless]",
    "wordcloud",
    "nltk"
]
test = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: long-running regression-guard tests, skipped by default (run with `pytest -m benchmark`)",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.basedpyright]
typeCheckingMode = "standard"
reportUnusedImport = false
exclude = [
    "**/__pycache__*",
    "**/.*",
    "**/data*",
]

[tool.ruff]
line-length = 140

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-cpu", platform = "linux-64" },
    { name = "win-cpu", platform = "win-64" },
    "osx-arm64",
    { name = "linux-cuda", platform = "linux-64", cuda = "12" },
    { name = "win-cuda", platform = "win-64", cuda = "12" },
]

[tool.pixi.pypi-dependencies]
ytm = { path = ".", editable = true, extras = ["examples"] }

[tool.pixi.dependencies]
clang = "*"
llvm-openmp = "*"

[tool.pixi.feature.dev.dependencies]
jupyterlab = "*"
ipdb = "*"
marimo = "*"

[tool.pixi.feature.cuda]
platforms = ["linux-cuda", "win-cuda"]

[tool.pixi.feature.cuda.dependencies]
cuda = "*"

[tool.pixi.environments]
default = { features = ["dev", "test"] }
cuda = { features = ["dev", "cuda", "test"] }
