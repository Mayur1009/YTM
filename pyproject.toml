[project]
authors = [{name = "Mayur", email = "mayurks@uia.no"}]
dependencies = [
    "numpy",
    "tqdm",
    "psutil",
]
name = "YTM"
requires-python = ">=3.11"
version = "0.7.3"

[project.optional-dependencies]
cuda = [
    "pycuda",
    "nvidia-ml-py",
    "cupy-cuda12x[ctk]",
]
examples = [
    "matplotlib",
    "seaborn",
    "datasets",
    "scikit-learn",
    "medmnist",
    "albumentationsx[headless]"
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.basedpyright]
typeCheckingMode = "standard"
reportUnusedImport = false
exclude = [
    "**/__pycache__*",
    "**/.*",
    "**/data*",
]

[tool.ruff]
line-length = 140

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
ytm = { path = ".", editable = true, extras = ["examples"] }

[tool.pixi.dependencies]
clang = "*"
llvm-openmp = "*"

[tool.pixi.feature.dev.dependencies]
jupyterlab = "*"
ipdb = "*"

[tool.pixi.feature.cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[tool.pixi.feature.cuda]
platforms = ["linux-64", "win-64"]
system-requirements = { cuda = "12" }

[tool.pixi.feature.cuda.dependencies]
cuda = "*"

[tool.pixi.environments]
default = { features = ["cpu"] }
cpu = { features = ["dev", "cpu"] }
cuda = { features = ["dev", "cuda"] }
