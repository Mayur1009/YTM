[project]
authors = [{name = "Mayur", email = "mayurks@uia.no"}]
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "psutil",
]
name = "YTM"
requires-python = ">=3.11"
version = "0.8.0+w1"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Extras
[project.optional-dependencies]
cuda = [
    "cupy-cuda12x[ctk]",
    "nvidia-ml-py",
]
examples = [
    "matplotlib",
    "seaborn",
    "datasets",
    "scikit-learn",
    "medmnist",
    "albumentationsx[headless]",
    "wordcloud",
    "nltk"
]

[dependency-groups]
test = ["pytest"]
dev = ["jupyterlab", "ipdb", "marimo", "rich", { include-group = "test" }]
bench = ["tmu @ git+https://github.com/cair/tmu.git", "datasets"]
bench-cuda = [
    "PySparseCoalescedTsetlinMachineCUDA @ git+https://github.com/cair/PySparseCoalescedTsetlinMachineCUDA.git",
    "pycuda",
    { include-group = "bench" },
]

# Pytest
[tool.pytest.ini_options]
addopts = "-m 'not benchmark and not statistical and not sanitize'"
markers = [
    "benchmark: long-running regression-guard tests, skipped by default (run with `pytest -m benchmark`)",
    "statistical: slow distribution/frequency tests, skipped by default (run with `pytest -m statistical`)",
    "sanitize: ASan/UBSan runs of tiny models, skipped by default (run with `pytest -m sanitize`)",
]

# Pixi environments
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-cpu", platform = "linux-64" },
    { name = "win-cpu", platform = "win-64" },
    "osx-arm64",

    # CUDA platforms
    { name = "linux-cuda", platform = "linux-64", cuda = "12" },
    { name = "win-cuda", platform = "win-64", cuda = "12" },
]

## Compiler and openmp
[tool.pixi.dependencies]
clang = "*"
llvm-openmp = "*"

[tool.pixi.pypi-dependencies]
ytm = { path = ".", editable = true, extras = ["examples"] }

## CUDA packages
[tool.pixi.feature.cuda]
platforms = ["linux-cuda", "win-cuda"]

[tool.pixi.feature.cuda.dependencies]
cuda = "*"

### Temporary tmu patch
[tool.pixi.feature.bench.target.osx-arm64.activation.env]
CC = "$PIXI_PROJECT_ROOT/bench/tmu_cc_temp_workaround.sh"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
cuda = { features = ["dev", "cuda"], solve-group = "cuda" }
bench = { features = ["bench"], solve-group = "default" }
bench-cuda = { features = ["cuda", "bench-cuda"], solve-group = "cuda" }

# LSPs, linters and foramtters
[tool.basedpyright]
typeCheckingMode = "standard"
reportUnusedImport = false
exclude = [
    "**/__pycache__*",
    "**/.*",
    "**/data*",
]

[tool.ruff]
line-length = 140
