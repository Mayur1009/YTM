[project]
authors = [{name = "Mayur", email = "mayurks@uia.no"}]
dependencies = [
    "numpy",
    "tqdm",
]
name = "YTM"
requires-python = ">=3.11"
version = "0.5+dev34"

[project.optional-dependencies]
cuda = [
  "pycuda",
]
examples = [
    "matplotlib",
    "tensorflow",
    "scikit-learn",
    "medmnist"
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
sources =["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ytm", "src/cutm"]

[tool.setuptools.package-data]
"*" = ["cuda/*.cu"]

[tool.basedpyright]
typeCheckingMode = "standard"
reportUnusedImport = false
exclude = [
    "**/__pycache__*",
    "**/.*",
    "**/data*",
]

[tool.ruff]
line-length = 120

